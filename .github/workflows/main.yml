name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    env:
      CI: true
      NODE_ENV: test
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      NEXT_PUBLIC_GAME_SERVER_URL: http://localhost:2567
      NEXT_PUBLIC_SOCKET_URL: http://localhost:2567
      TURNSTILE_SECRET_KEY: ci-turnstile-secret
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Lint web
        run: pnpm --filter web lint
      - name: Typecheck web
        run: pnpm exec tsc --noEmit -p apps/web/tsconfig.json
      - name: Typecheck game-server
        run: pnpm exec tsc --noEmit -p apps/game-server/tsconfig.json
      - name: Web coverage gate 98
        run: >
          pnpm --filter web exec jest
          --coverage
          --ci
          --forceExit
          --coverageReporters=json-summary
          --coverageReporters=lcov
          --coverageThreshold='{"global":{"statements":98,"branches":98,"functions":98,"lines":98}}'
      - name: Game server coverage gate 98
        run: >
          pnpm --filter game-server exec vitest run
          --coverage
          --coverage.thresholds.statements=98
          --coverage.thresholds.branches=98
          --coverage.thresholds.functions=98
          --coverage.thresholds.lines=98
      - name: Build web
        run: pnpm --filter web build
      - name: Upload web coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: apps/web/coverage
      - name: Upload game-server coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-server-coverage
          path: apps/game-server/coverage

  # ── Build & Push Game Server Image (solo en main, después de los checks) ─
  # Publica una imagen inmutable a GHCR. NO toca el VPS: el VPS hace pull
  # más tarde mediante `mesa-deploy` con guardrail (ver docs/deployment).
  publish-game-server-image:
    name: Publish game-server image (GHCR)
    runs-on: ubuntu-latest
    needs: [quality-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/mesa-game-server
          tags: |
            type=raw,value=main
            type=sha,format=long,prefix=sha-
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/game-server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Output digest
        run: |
          echo "Pushed image digests:"
          echo "${{ steps.meta.outputs.tags }}"
