name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint ────────────────────────────────────────────────
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Lint web
        run: pnpm --filter web lint

  # ── Type Check ──────────────────────────────────────────
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Typecheck web
        run: pnpm exec tsc --noEmit -p apps/web/tsconfig.json
      - name: Typecheck game-server
        run: pnpm exec tsc --noEmit -p apps/game-server/tsconfig.json

  # ── Unit Tests: Web (Jest 30) ───────────────────────────
  test-web:
    name: Tests Web (Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Run Jest tests with coverage
        run: pnpm --filter web exec jest --coverage --ci --forceExit

  # ── Unit Tests: Game Server (Vitest 4) ──────────────────
  test-game-server:
    name: Tests Game Server (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Run Vitest tests with coverage
        run: pnpm --filter game-server test:coverage

  # ── Build (solo si todos los checks pasan) ─────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test-web, test-game-server]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Build web
        run: pnpm --filter web build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          NEXT_PUBLIC_GAME_SERVER_URL: http://localhost:2567
          NEXT_PUBLIC_SOCKET_URL: http://localhost:2567

  # ── Build & Push Game Server Image (solo en main, después de los checks) ─
  # Publica una imagen inmutable a GHCR. NO toca el VPS: el VPS hace pull
  # más tarde mediante `mesa-deploy` con guardrail (ver docs/deployment).
  publish-game-server-image:
    name: Publish game-server image (GHCR)
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test-web, test-game-server]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/mesa-game-server
          tags: |
            type=raw,value=main
            type=sha,format=long,prefix=sha-
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/game-server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Output digest
        run: |
          echo "Pushed image digests:"
          echo "${{ steps.meta.outputs.tags }}"
