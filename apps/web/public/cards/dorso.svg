<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 416 638" width="832" height="1276">
  <title>Dorso de carta</title>
  <defs>
    <clipPath id="card"><rect width="416" height="638" rx="27" ry="27"/></clipPath>

    <!-- Borde exterior: damero -->
    <pattern id="checker" width="18" height="18" patternUnits="userSpaceOnUse" x="2" y="2">
      <rect width="18" height="18" fill="#ffffff"/>
      <rect width="9" height="9" fill="#1d2747"/>
      <rect x="9" y="9" width="9" height="9" fill="#1d2747"/>
    </pattern>

    <!-- Cenefa: arcos entrelazados con flor de lis (horizontal) -->
    <pattern id="frieze-h" width="24" height="30" patternUnits="userSpaceOnUse" x="4" y="0">
      <rect width="24" height="30" fill="#1d2747"/>
      <g fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round">
        <path d="M0 21 Q6 9 12 21 Q18 9 24 21"/>
        <circle cx="12" cy="23.5" r="2"/>
        <circle cx="0" cy="23.5" r="2"/>
        <circle cx="24" cy="23.5" r="2"/>
      </g>
      <g fill="#ffffff">
        <path d="M6 5 C4.6 8 4.6 10.5 6 13 C7.4 10.5 7.4 8 6 5 Z"/>
        <path d="M6 12 C4 10.5 2.6 11 2 13 C3.6 12.6 4.8 13 6 14 Z"/>
        <path d="M6 12 C8 10.5 9.4 11 10 13 C8.4 12.6 7.2 13 6 14 Z"/>
        <path d="M18 5 C16.6 8 16.6 10.5 18 13 C19.4 10.5 19.4 8 18 5 Z"/>
        <path d="M18 12 C16 10.5 14.6 11 14 13 C15.6 12.6 16.8 13 18 14 Z"/>
        <path d="M18 12 C20 10.5 21.4 11 22 13 C20.4 12.6 19.2 13 18 14 Z"/>
      </g>
    </pattern>
    <pattern id="frieze-v" href="#frieze-h" patternTransform="rotate(90)"/>

    <!-- Celosía central: rombos azules separados por líneas blancas -->
    <pattern id="lattice" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="rotate(45 208 319)">
      <rect width="11" height="11" fill="#ffffff"/>
      <rect x="1.6" y="1.6" width="7.8" height="7.8" fill="#1d2747"/>
      <rect x="4.3" y="4.3" width="2.4" height="2.4" fill="#ffffff"/>
    </pattern>

    <!-- Hoja acantada que apunta hacia arriba (se rota 4 veces) -->
    <path id="leaf" d="M0 -58 C5 -50 6 -46 4 -42 C9 -44 12 -40 11 -35 C15 -36 17 -31 14 -27 C10 -24 6 -24 0 -22 C-6 -24 -10 -24 -14 -27 C-17 -31 -15 -36 -11 -35 C-12 -40 -9 -44 -4 -42 C-6 -46 -5 -50 0 -58 Z"/>
    <!-- Pétalo redondo en diagonal -->
    <g id="petal">
      <circle cx="0" cy="-25" r="15" fill="#1d2747"/>
      <circle cx="0" cy="-25" r="15" fill="none" stroke="#ffffff" stroke-width="1.4"/>
      <path d="M-8 -16 Q0 -30 8 -16" fill="none" stroke="#ffffff" stroke-width="1.3"/>
    </g>
  </defs>

  <g clip-path="url(#card)">
    <!-- Damero exterior -->
    <rect width="416" height="638" fill="url(#checker)"/>

    <!-- Filete blanco + cenefa -->
    <rect x="34" y="34" width="348" height="570" fill="#ffffff"/>
    <rect x="37" y="37" width="342" height="564" fill="#1d2747"/>
    <rect x="37" y="37" width="342" height="30" fill="url(#frieze-h)"/>
    <rect x="37" y="571" width="342" height="30" fill="url(#frieze-h)" transform="rotate(180 208 586)"/>
    <rect x="37" y="67" width="30" height="504" fill="url(#frieze-v)"/>
    <rect x="349" y="67" width="30" height="504" fill="url(#frieze-v)" transform="rotate(180 364 319)"/>

    <!-- Florones de esquina -->
    <g fill="#ffffff">
      <circle cx="52" cy="52" r="5"/><circle cx="364" cy="52" r="5"/>
      <circle cx="52" cy="586" r="5"/><circle cx="364" cy="586" r="5"/>
    </g>
    <g fill="#1d2747">
      <circle cx="52" cy="52" r="2"/><circle cx="364" cy="52" r="2"/>
      <circle cx="52" cy="586" r="2"/><circle cx="364" cy="586" r="2"/>
    </g>

    <!-- Filete doble y celosía central -->
    <rect x="67" y="67" width="282" height="504" fill="#ffffff"/>
    <rect x="70" y="70" width="276" height="498" fill="#1d2747"/>
    <rect x="72.5" y="72.5" width="271" height="493" fill="url(#lattice)"/>

    <!-- Rombo central -->
    <g transform="translate(208 319)">
      <path d="M0 -82 L82 0 L0 82 L-82 0 Z" fill="#ffffff"/>
      <path d="M0 -78 L78 0 L0 78 L-78 0 Z" fill="none" stroke="#1d2747" stroke-width="2.4"/>
      <path d="M0 -71 L71 0 L0 71 L-71 0 Z" fill="none" stroke="#1d2747" stroke-width="1"/>

      <g fill="#1d2747">
        <use href="#leaf"/>
        <use href="#leaf" transform="rotate(90)"/>
        <use href="#leaf" transform="rotate(180)"/>
        <use href="#leaf" transform="rotate(270)"/>
      </g>
      <use href="#petal" transform="rotate(45)"/>
      <use href="#petal" transform="rotate(135)"/>
      <use href="#petal" transform="rotate(225)"/>
      <use href="#petal" transform="rotate(315)"/>

      <circle r="12" fill="#ffffff" stroke="#1d2747" stroke-width="2.4"/>
      <circle r="6.5" fill="none" stroke="#1d2747" stroke-width="1.6"/>
      <circle r="2.4" fill="#1d2747"/>
    </g>
  </g>
</svg>
