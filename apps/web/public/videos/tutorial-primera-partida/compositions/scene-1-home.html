<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <title>Cómo Jugar tu Primera Partida — Escena 1: Home</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #073926;
      font-family: system-ui, sans-serif;
    }
  </style>
</head>
<body>
<div data-composition-id="scene-1-home" data-width="1080" data-height="1920">

  <style>
    [data-composition-id="scene-1-home"] {
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #073926 0%, #0a2015 50%, #073926 100%);
      position: relative;
      overflow: hidden;
    }
    .bg-texture {
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='60' height='60' fill='none'/%3E%3Ccircle cx='30' cy='30' r='1' fill='%23ffffff' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
    }
    .card-bg {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 40px 40px;
      gap: 20px;
    }
    .logo-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
    }
    .logo-svg { width: 80px; height: 80px; }
    .logo-text {
      font-family: Georgia, serif;
      font-size: 28px;
      font-weight: 700;
      color: #d4af37;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }
    .card-phone {
      width: 320px;
      height: 540px;
      background: linear-gradient(180deg, #0d211a 0%, #0a180e 100%);
      border-radius: 28px;
      border: 2px solid rgba(212,175,55,0.3);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 30px 80px rgba(0,0,0,0.8), inset 0 1px 1px rgba(212,175,55,0.1);
      position: relative;
    }
    .phone-notch {
      width: 80px;
      height: 20px;
      background: #0a180e;
      border-radius: 0 0 12px 12px;
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }
    .phone-header {
      padding: 28px 16px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(212,175,55,0.15);
    }
    .header-balance {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }
    .balance-label {
      font-size: 9px;
      color: rgba(253,240,166,0.5);
      text-transform: uppercase;
      letter-spacing: 0.2em;
      font-weight: 700;
    }
    .balance-value {
      font-size: 18px;
      font-weight: 900;
      color: #4ade80;
      font-family: Georgia, serif;
    }
    .header-actions {
      display: flex;
      gap: 8px;
    }
    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(212,175,55,0.1);
      border: 1px solid rgba(212,175,55,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-btn svg { width: 18px; height: 18px; }
    .phone-content {
      flex: 1;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .section-title {
      font-size: 11px;
      font-weight: 900;
      color: #d4af37;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      margin-bottom: 4px;
    }
    .lobby-btn {
      flex: 1;
      max-height: 160px;
      background: linear-gradient(180deg, #0d211a 0%, #0a180e 100%);
      border: 2px solid rgba(212,175,55,0.3);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .lobby-btn:hover {
      border-color: rgba(212,175,55,0.6);
      background: linear-gradient(180deg, #0f2a1f 0%, #0c1f12 100%);
    }
    .lobby-btn.active {
      border-color: #d4af37;
      box-shadow: 0 0 20px rgba(212,175,55,0.2);
    }
    .lobby-btn .icon-wrap {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(212,175,55,0.2) 0%, rgba(212,175,55,0.05) 100%);
      border: 1px solid rgba(212,175,55,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .lobby-btn .icon-wrap svg { width: 28px; height: 28px; color: #d4af37; }
    .lobby-btn span {
      font-size: 14px;
      font-weight: 900;
      color: #f3edd7;
      text-transform: uppercase;
      letter-spacing: 0.2em;
    }
    .phone-footer {
      padding: 12px 16px 16px;
      display: flex;
      gap: 8px;
    }
    .footer-btn {
      flex: 1;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .btn-primary {
      background: linear-gradient(180deg, #fdf0a6 0%, #d4af37 50%, #8a6d1c 100%);
      color: #2a1b04;
      border-bottom: 3px solid #5c4613;
    }
    .btn-secondary {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: #f3edd7;
    }
    .btn-secondary svg { width: 16px; height: 16px; }
    .finger {
      position: absolute;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(255,255,255,0.8);
      pointer-events: none;
      box-shadow: 0 0 0 3px rgba(255,255,255,0.3), 0 4px 12px rgba(0,0,0,0.5);
      z-index: 100;
      transform: translate(-50%, -50%);
    }
    .finger::after {
      content: '';
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      background: rgba(255,255,255,0.4);
    }
    .caption {
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10,24,14,0.95);
      border: 1px solid rgba(212,175,55,0.3);
      border-radius: 12px;
      padding: 12px 24px;
      max-width: 600px;
      text-align: center;
    }
    .caption-text {
      font-size: 16px;
      font-weight: 700;
      color: #fdf0a6;
      letter-spacing: 0.05em;
    }
    .caption-sub {
      font-size: 12px;
      color: rgba(243,237,215,0.6);
      margin-top: 4px;
    }
  </style>

  <div class="bg-texture"></div>
  <div class="card-bg">
    <div class="logo-area">
      <svg class="logo-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <rect x="44" y="22" width="112" height="156" rx="10" fill="#f4e8c8" stroke="#8b6b2e" stroke-width="2"/>
        <rect x="50" y="28" width="100" height="144" rx="6" fill="none" stroke="#8b6b2e" stroke-width="0.7" opacity="0.5"/>
        <text x="56" y="46" font-family="Georgia,serif" font-size="16" font-weight="700" fill="#071828">A</text>
        <text x="144" y="160" text-anchor="end" font-family="Georgia,serif" font-size="16" font-weight="700" fill="#071828">A</text>
        <g transform="translate(78 70) scale(0.85)">
          <polygon points="0,-24 4,-2 -4,-2" fill="#4f96cc"/>
          <polygon points="0,-24 0,-2 -4,-2" fill="#7dbbe6" opacity="0.55"/>
          <rect x="-12" y="-2" width="24" height="4.5" rx="2" fill="#1f4f7b"/>
          <rect x="-2.5" y="2.5" width="5" height="11" rx="1" fill="#4f96cc"/>
          <ellipse cx="0" cy="16" rx="6" ry="4.5" fill="#4f96cc"/>
          <circle cx="0" cy="16" r="2" fill="#7dbbe6"/>
        </g>
        <g transform="translate(122 70) scale(0.85)">
          <path d="M -11 -16 Q -11 -2 0 -2 Q 11 -2 11 -16 Z" fill="#7a1f18"/>
          <ellipse cx="0" cy="-15.5" rx="11" ry="2.2" fill="#8b6b2e"/>
          <rect x="-1.6" y="-2" width="3.2" height="11" fill="#8b6b2e"/>
          <ellipse cx="0" cy="11.5" rx="9.5" ry="2.6" fill="#8b6b2e"/>
          <path d="M -7 -13 Q 0 -7 7 -13" stroke="#8b6b2e" stroke-width="0.8" fill="none" opacity="0.6"/>
        </g>
        <g transform="translate(78 130) scale(0.85)">
          <circle cx="0" cy="0" r="14" fill="#8b6b2e"/>
          <circle cx="-3" cy="-3" r="6" fill="#e2b044" opacity="0.5"/>
          <circle cx="0" cy="0" r="11" fill="none" stroke="#f4e8c8" stroke-width="0.8" opacity="0.6"/>
          <circle cx="0" cy="0" r="8" fill="none" stroke="#f4e8c8" stroke-width="0.6" opacity="0.4"/>
          <text x="0" y="3.5" text-anchor="middle" font-family="Georgia,serif" font-size="10" font-weight="700" fill="#f4e8c8">A</text>
        </g>
        <g transform="translate(122 130) scale(0.85)">
          <path d="M -7 -18 Q -8 -22 0 -24 Q 8 -22 7 -18 Q 6 -8 2 4 Q 1 10 0 16 Q -1 10 -2 4 Q -6 -8 -7 -18 Z" fill="#4ea80f" stroke="#2b7a1f" stroke-width="0.8" stroke-linejoin="round"/>
        </g>
        <line x1="100" y1="55" x2="100" y2="145" stroke="#8b6b2e" stroke-width="0.4" opacity="0.4"/>
        <line x1="60" y1="100" x2="140" y2="100" stroke="#8b6b2e" stroke-width="0.4" opacity="0.4"/>
      </svg>
      <span class="logo-text">Mesa Primera</span>
    </div>

    <div class="card-phone">
      <div class="phone-notch"></div>
      <div class="phone-header">
        <div class="header-balance">
          <span class="balance-label">Saldo</span>
          <span class="balance-value">$50.000</span>
        </div>
        <div class="header-actions">
          <div class="icon-btn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          </div>
          <div class="icon-btn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#d4af37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          </div>
        </div>
      </div>
      <div class="phone-content">
        <div class="section-title">Acciones</div>
        <div class="lobby-btn" id="lobby-btn">
          <div class="icon-wrap">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          </div>
          <span>Entrar al Lobby</span>
        </div>
      </div>
      <div class="phone-footer">
        <div class="footer-btn btn-secondary">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          Ayuda
        </div>
        <div class="footer-btn btn-primary">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Recargar
        </div>
      </div>
    </div>
  </div>

  <div class="finger" id="finger"></div>

  <div class="caption" id="caption">
    <div class="caption-text">Toca "Entrar al Lobby" para ver las mesas disponibles</div>
    <div class="caption-sub">Si no tienes saldo, recarga primero</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Entrance animations
    tl.from(".logo-area", { y: -30, opacity: 0, duration: 0.6, ease: "power3.out" }, 0.2)
      .from(".card-phone", { scale: 0.92, opacity: 0, duration: 0.7, ease: "back.out(1.2)" }, 0.4)
      .from(".lobby-btn", { scale: 0.95, opacity: 0, duration: 0.5, ease: "power2.out" }, 0.8)
      .from(".caption", { y: 30, opacity: 0, duration: 0.5, ease: "power3.out" }, 1.2)
      .from(".finger", { scale: 0, opacity: 0, duration: 0.3, ease: "back.out(2)" }, 1.5);

    // Finger moves to lobby button
    tl.to("#finger", { x: 0, y: 0, duration: 0.01 }, 1.8)
      .to("#finger", { x: 0, y: 60, duration: 1.2, ease: "power2.inOut" }, 1.8)
      // Tap animation on lobby button
      .to("#finger", { scale: 1.3, duration: 0.15, ease: "power2.out" }, 3.1)
      .to("#finger", { scale: 1, duration: 0.15, ease: "power2.in" }, 3.25)
      // Lobby button glows
      .to("#lobby-btn", { borderColor: "#d4af37", boxShadow: "0 0 30px rgba(212,175,55,0.4)", duration: 0.3, ease: "power2.out" }, 3.3);

    window.__timelines["scene-1-home"] = tl;
  </script>
</div>
</body>
</html>
