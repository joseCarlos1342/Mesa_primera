<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <title>Escena 4: Sala de Espera</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; background: #073926; }
  </style>
</head>
<body>
<div data-composition-id="scene-4-waiting" data-width="1080" data-height="1920">

  <style>
    [data-composition-id="scene-4-waiting"] {
      width: 100%; height: 100%;
      background: linear-gradient(180deg, #073926 0%, #0a2015 100%);
      position: relative; overflow: hidden;
    }
    .bg-texture {
      position: absolute; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='60' height='60' fill='none'/%3E%3Ccircle cx='30' cy='30' r='1' fill='%23ffffff' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
    }
    .scene { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 30px; }

    /* Phone frame that rotates to landscape */
    .phone-wrapper {
      position: relative;
      width: 520px; /* wider to simulate landscape */
      height: 280px;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .phone-frame {
      width: 100%; height: 100%;
      background: linear-gradient(180deg, #0d211a 0%, #0a180e 100%);
      border-radius: 32px; border: 2px solid rgba(212,175,55,0.3);
      overflow: hidden; display: flex; flex-direction: column;
      box-shadow: 0 30px 80px rgba(0,0,0,0.8);
    }

    /* Landscape content */
    .waiting-content {
      flex: 1; display: flex; flex-direction: column;
      padding: 12px 16px;
    }
    .waiting-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 8px;
    }
    .waiting-title {
      display: flex; align-items: center; gap: 8px;
    }
    .waiting-title svg { width: 18px; height: 18px; color: #c5a059; }
    .waiting-title span {
      font-size: 14px; font-weight: 900; color: #c5a059;
      text-transform: uppercase; letter-spacing: 0.15em;
    }
    .player-count {
      font-size: 10px; color: rgba(243,237,215,0.6); font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.1em;
    }
    .player-count em { color: #c5a059; font-style: normal; }
    .table-info-row {
      display: flex; gap: 10px; margin-bottom: 10px;
    }
    .info-badge {
      display: flex; align-items: center; gap: 5px;
      background: rgba(0,0,0,0.4); border: 1px solid rgba(212,175,55,0.2);
      border-radius: 8px; padding: 4px 10px;
    }
    .info-badge span:first-child { font-size: 9px; color: rgba(243,237,215,0.4); text-transform: uppercase; letter-spacing: 0.1em; }
    .info-badge span:last-child { font-size: 11px; color: #d4af37; font-weight: 700; }
    .players-grid {
      flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    }
    .player-slot {
      background: rgba(0,0,0,0.3); border: 1px solid rgba(212,175,55,0.15);
      border-radius: 12px; padding: 8px;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .player-slot.ready {
      border-color: rgba(74,222,128,0.4);
      background: rgba(74,222,128,0.05);
    }
    .player-slot.you {
      border-color: rgba(212,175,55,0.4);
      background: rgba(212,175,55,0.05);
    }
    .status-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: #4ade80; box-shadow: 0 0 8px rgba(74,222,128,0.5);
    }
    .player-slot:not(.ready) .status-dot { background: #f87171; box-shadow: none; }
    .player-name {
      font-size: 11px; font-weight: 700; color: #f3edd7; text-align: center;
    }
    .player-chips {
      font-size: 9px; color: #c5a059; font-family: Georgia, serif; font-weight: 600;
    }
    .dealer-badge {
      padding: 2px 6px; border-radius: 4px;
      background: linear-gradient(180deg, #fdf0a6, #d4af37, #8a6d1c);
      font-size: 7px; font-weight: 900; color: #2a1b04;
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    .ready-btn {
      width: 100%; height: 40px;
      background: linear-gradient(180deg, #2ecc71 0%, #27ae60 50%, #1e8449 100%);
      border-radius: 12px; display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 900; color: white;
      text-transform: uppercase; letter-spacing: 0.2em;
      border-bottom: 4px solid #14532d;
      cursor: pointer;
    }

    .finger {
      position: absolute; width: 24px; height: 24px; border-radius: 50%;
      background: rgba(255,255,255,0.8); pointer-events: none;
      box-shadow: 0 0 0 3px rgba(255,255,255,0.3), 0 4px 12px rgba(0,0,0,0.5);
      z-index: 100; transform: translate(-50%, -50%);
    }
    .caption {
      position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%);
      background: rgba(10,24,14,0.95); border: 1px solid rgba(212,175,55,0.3);
      border-radius: 12px; padding: 12px 24px; max-width: 600px; text-align: center;
    }
    .caption-text { font-size: 15px; font-weight: 700; color: #fdf0a6; }
    .caption-sub { font-size: 11px; color: rgba(243,237,215,0.6); margin-top: 4px; }
    .rotate-hint {
      position: absolute; top: 30px; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 6px;
      background: rgba(0,0,0,0.5); border: 1px solid rgba(212,175,55,0.2);
      border-radius: 20px; padding: 6px 14px;
    }
    .rotate-hint svg { width: 14px; height: 14px; color: #d4af37; animation: rotate-hint 2s ease-in-out infinite; }
    @keyframes rotate-hint { 0%, 100% { transform: rotate(-20deg); } 50% { transform: rotate(20deg); } }
    .rotate-hint span { font-size: 10px; color: #d4af37; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; }
  </style>

  <div class="bg-texture"></div>

  <div class="rotate-hint" id="rotate-hint">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="2" ry="2"/><path d="M22 8V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
    <span>Mesa en horizontal</span>
  </div>

  <div class="scene">
    <div class="phone-wrapper" id="phone-wrapper">
      <div class="phone-frame">
        <div class="waiting-content">
          <div class="waiting-header">
            <div class="waiting-title">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
              <span>Sala de Espera</span>
            </div>
            <div class="player-count">Jugadores: <em>3 / 7</em></div>
          </div>
          <div class="table-info-row">
            <div class="info-badge"><span>Pique Mín:</span><span>$5.000</span></div>
            <div class="info-badge"><span>Banda:</span><span>$1.000</span></div>
          </div>
          <div class="players-grid">
            <div class="player-slot ready">
              <div class="status-dot"></div>
              <div class="player-name">Carlos</div>
              <div class="player-chips">$80K</div>
              <div class="dealer-badge">Mano</div>
            </div>
            <div class="player-slot ready">
              <div class="status-dot"></div>
              <div class="player-name">María</div>
              <div class="player-chips">$120K</div>
            </div>
            <div class="player-slot you">
              <div class="status-dot"></div>
              <div class="player-name">Tú</div>
              <div class="player-chips">$150K</div>
            </div>
          </div>
          <div class="ready-btn" id="ready-btn">¡Estoy Listo!</div>
        </div>
      </div>
    </div>
  </div>

  <div class="finger" id="finger"></div>

  <div class="caption" id="caption">
    <div class="caption-text">Confirma que estás listo para jugar</div>
    <div class="caption-sub">Cuando todos confirmen, la partida comenzará</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Phone appears already in landscape position
    tl.from("#phone-wrapper", { scale: 0.8, opacity: 0, duration: 0.7, ease: "back.out(1.2)" }, 0.2)
      .from(".player-slot", { y: 15, opacity: 0, duration: 0.4, stagger: 0.12, ease: "power2.out" }, 0.5)
      .from(".ready-btn", { scale: 0.95, opacity: 0, duration: 0.5, ease: "back.out(1.4)" }, 0.9)
      .from(".rotate-hint", { opacity: 0, duration: 0.4 }, 0.3)
      .from(".caption", { y: 30, opacity: 0, duration: 0.5, ease: "power3.out" }, 1.1)
      .from(".finger", { scale: 0, opacity: 0, duration: 0.3, ease: "back.out(2)" }, 1.4);

    // Finger moves to ready button
    tl.to("#finger", { x: 0, y: 0, duration: 0.01 }, 1.6)
      .to("#finger", { x: 0, y: 10, duration: 1.0, ease: "power2.inOut" }, 1.6)
      .to("#finger", { scale: 1.3, duration: 0.15 }, 2.7)
      .to("#finger", { scale: 1, duration: 0.15 }, 2.85)
      .to("#ready-btn", { scale: 0.97, backgroundColor: "#27ae60", duration: 0.2 }, 2.9)
      .to("#rotate-hint", { opacity: 0, y: -10, duration: 0.3 }, 3.0);

    window.__timelines["scene-4-waiting"] = tl;
  </script>
</div>
</body>
</html>
