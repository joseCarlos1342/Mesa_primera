<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <title>Escena 3: Recargar Saldo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; background: #073926; }
  </style>
</head>
<body>
<div data-composition-id="scene-3-deposit" data-width="1080" data-height="1920">

  <style>
    [data-composition-id="scene-3-deposit"] {
      width: 100%; height: 100%;
      background: linear-gradient(180deg, #073926 0%, #0a2015 100%);
      position: relative; overflow: hidden;
    }
    .bg-texture {
      position: absolute; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='60' height='60' fill='none'/%3E%3Ccircle cx='30' cy='30' r='1' fill='%23ffffff' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
    }
    .scene { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding: 50px 30px 30px; }
    .modal {
      width: 340px; flex: 1;
      background: linear-gradient(180deg, #1b4d3e 0%, #0d211a 100%);
      border: 2px solid rgba(212,175,55,0.4); border-radius: 32px;
      overflow: hidden; display: flex; flex-direction: column;
      box-shadow: 0 40px 100px rgba(0,0,0,0.9);
      position: relative;
    }
    .modal-header {
      padding: 20px 20px 14px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid rgba(212,175,55,0.2);
    }
    .modal-title {
      font-family: Georgia, serif; font-size: 22px; font-weight: 900;
      font-style: italic; color: #d4af37; text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .close-btn {
      width: 36px; height: 36px; border-radius: 10px;
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      display: flex; align-items: center; justify-content: center;
    }
    .close-btn svg { width: 16px; height: 16px; color: #f3edd7; }
    .modal-body { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
    .field-card {
      background: rgba(0,0,0,0.4); border: 1px solid rgba(212,175,55,0.2);
      border-radius: 16px; padding: 14px;
    }
    .field-label {
      font-size: 9px; font-weight: 900; color: rgba(253,240,166,0.5);
      text-transform: uppercase; letter-spacing: 0.3em; margin-bottom: 8px;
    }
    .nequi-row { display: flex; align-items: center; gap: 10px; }
    .nequi-icon {
      width: 40px; height: 40px; border-radius: 10px;
      background: linear-gradient(135deg, rgba(212,175,55,0.2), rgba(212,175,55,0.05));
      border: 1px solid rgba(212,175,55,0.3);
      display: flex; align-items: center; justify-content: center;
    }
    .nequi-icon svg { width: 20px; height: 20px; color: #d4af37; }
    .nequi-info { flex: 1; }
    .nequi-type { font-size: 10px; color: #c0a060; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; }
    .nequi-number {
      font-family: Georgia, serif; font-size: 20px; font-weight: 900;
      color: #f3edd7; letter-spacing: 0.05em;
    }
    .copy-btn {
      padding: 6px 12px; border-radius: 8px;
      background: rgba(212,175,55,0.1); border: 1px solid rgba(212,175,55,0.3);
      display: flex; align-items: center; gap: 4px;
    }
    .copy-btn svg { width: 14px; height: 14px; color: #d4af37; }
    .copy-btn span { font-size: 10px; font-weight: 700; color: #d4af37; text-transform: uppercase; }
    .input-field {
      width: 100%; height: 52px;
      background: rgba(0,0,0,0.5); border: 1.5px solid rgba(212,175,55,0.2);
      border-radius: 12px; padding: 0 16px;
      font-family: Georgia, serif; font-size: 20px; font-weight: 900;
      color: #f3edd7; outline: none;
      transition: border-color 0.2s;
    }
    .input-field::placeholder { color: rgba(243,237,215,0.15); }
    .input-field:focus { border-color: rgba(212,175,55,0.6); }
    .upload-zone {
      border: 2px dashed rgba(212,175,55,0.2); border-radius: 14px;
      background: rgba(0,0,0,0.3);
      height: 100px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 6px;
      cursor: pointer;
    }
    .upload-zone svg { width: 24px; height: 24px; color: rgba(212,175,55,0.4); }
    .upload-zone span { font-size: 11px; font-weight: 700; color: rgba(243,237,215,0.3); text-transform: uppercase; letter-spacing: 0.1em; }
    .upload-zone small { font-size: 9px; color: rgba(243,237,215,0.2); }
    .notes-field {
      width: 100%; height: 60px;
      background: rgba(0,0,0,0.5); border: 1.5px solid rgba(212,175,55,0.15);
      border-radius: 12px; padding: 12px;
      font-size: 12px; color: #f3edd7; outline: none; resize: none;
    }
    .notes-field::placeholder { color: rgba(243,237,215,0.15); }
    .submit-btn {
      width: 100%; height: 52px;
      background: linear-gradient(180deg, #fdf0a6 0%, #d4af37 50%, #8a6d1c 100%);
      border-radius: 14px; display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 900; color: #2a1b04;
      text-transform: uppercase; letter-spacing: 0.2em;
      border-bottom: 4px solid #5c4613;
      gap: 8px;
    }
    .submit-btn svg { width: 18px; height: 18px; }
    .finger {
      position: absolute; width: 24px; height: 24px; border-radius: 50%;
      background: rgba(255,255,255,0.8); pointer-events: none;
      box-shadow: 0 0 0 3px rgba(255,255,255,0.3), 0 4px 12px rgba(0,0,0,0.5);
      z-index: 100; transform: translate(-50%, -50%);
    }
    .flash-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, #fdf0a6, #d4af37);
      z-index: 200; opacity: 0; pointer-events: none;
    }
    .caption {
      position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%);
      background: rgba(10,24,14,0.95); border: 1px solid rgba(212,175,55,0.3);
      border-radius: 12px; padding: 12px 24px; max-width: 600px; text-align: center;
    }
    .caption-text { font-size: 15px; font-weight: 700; color: #fdf0a6; }
    .caption-sub { font-size: 11px; color: rgba(243,237,215,0.6); margin-top: 4px; }
    .step-indicator {
      position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 6px; z-index: 10;
    }
    .step-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: rgba(212,175,55,0.2); border: 1px solid rgba(212,175,55,0.3);
    }
    .step-dot.active {
      background: #d4af37; border-color: #d4af37;
    }
    .step-dot.done {
      background: rgba(74,222,128,0.5); border-color: #4ade80;
    }
  </style>

  <div class="bg-texture"></div>

  <div class="step-indicator" id="step-indicator">
    <div class="step-dot active" id="dot0"></div>
    <div class="step-dot" id="dot1"></div>
    <div class="step-dot" id="dot2"></div>
    <div class="step-dot" id="dot3"></div>
  </div>

  <div class="scene">
    <div class="modal" id="modal">
      <div class="modal-header">
        <span class="modal-title">Cargar Saldo</span>
        <div class="close-btn">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </div>
      </div>
      <div class="modal-body">
        <!-- Nequi -->
        <div class="field-card" id="field-nequi">
          <div class="field-label">Cuenta de Transferencia</div>
          <div class="nequi-row">
            <div class="nequi-icon">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
            </div>
            <div class="nequi-info">
              <div class="nequi-type">Nequi Personal</div>
              <div class="nequi-number">3125822841</div>
            </div>
            <div class="copy-btn" id="copy-btn">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              <span>Copiar</span>
            </div>
          </div>
        </div>

        <!-- Amount -->
        <div class="field-card" id="field-amount">
          <div class="field-label">Monto a Cargar ($)</div>
          <input class="input-field" type="text" id="amount-input" placeholder="0" readonly style="cursor:text">
        </div>

        <!-- Upload -->
        <div class="field-card" id="field-upload">
          <div class="field-label">Comprobante de Pago</div>
          <div class="upload-zone" id="upload-zone">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            <span>Presiona para subir</span>
            <small>PNG, JPG — Máx. 5 MB</small>
          </div>
        </div>

        <!-- Notes -->
        <div class="field-card" id="field-notes">
          <div class="field-label">Notas (opcional)</div>
          <textarea class="notes-field" placeholder="Escribe aquí..." readonly style="cursor:text"></textarea>
        </div>

        <!-- Submit -->
        <div class="submit-btn" id="submit-btn">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          Confirmar Depósito
        </div>
      </div>
    </div>
  </div>

  <div class="flash-overlay" id="flash"></div>
  <div class="finger" id="finger"></div>

  <div class="caption" id="caption">
    <div class="caption-text">Transfiere al Nequi y sube el comprobante</div>
    <div class="caption-sub">El proceso de recarga es rápido y seguro</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    tl.from(".modal", { y: 60, opacity: 0, duration: 0.7, ease: "power3.out" }, 0.2)
      .from(".field-card", { y: 20, opacity: 0, duration: 0.4, stagger: 0.1, ease: "power2.out" }, 0.5)
      .from(".step-indicator", { opacity: 0, duration: 0.3 }, 0.3)
      .from(".caption", { y: 30, opacity: 0, duration: 0.5, ease: "power3.out" }, 1.0)
      .from(".finger", { scale: 0, opacity: 0, duration: 0.3, ease: "back.out(2)" }, 1.3);

    // Step 0: copy nequi
    tl.to("#finger", { x: 0, y: 0, duration: 0.01 }, 1.5)
      .to("#finger", { x: 80, y: 30, duration: 0.8, ease: "power2.inOut" }, 1.5)
      .to("#finger", { scale: 1.3, duration: 0.12 }, 2.4)
      .to("#finger", { scale: 1, duration: 0.12 }, 2.52)
      .to("#copy-btn", { scale: 0.95, backgroundColor: "rgba(212,175,55,0.3)", duration: 0.2 }, 2.55)
      .to("#dot0", { className: "step-dot done", duration: 0.01 }, 2.7)
      .to("#dot1", { className: "step-dot active", duration: 0.3 }, 2.7);

    // Step 1: type amount
    tl.to("#finger", { x: 0, y: 0, duration: 0.01 }, 3.0)
      .to("#finger", { x: 0, y: 60, duration: 0.8, ease: "power2.inOut" }, 3.0)
      .to("#finger", { scale: 1.3, duration: 0.12 }, 3.9)
      .to("#finger", { scale: 1, duration: 0.12 }, 4.02)
      .to("#amount-input", { borderColor: "rgba(212,175,55,0.6)", duration: 0.2 }, 4.05)
      // simulate typing effect via placeholder change
      .to("#caption .caption-text", { opacity: 0, duration: 0.15 }, 4.1)
      .to("#caption .caption-text", { textContent: "Escribe el monto que transferiste", duration: 0 }, 4.25)
      .to("#caption .caption-text", { opacity: 1, duration: 0.15 }, 4.25)
      .to("#dot1", { className: "step-dot done", duration: 0.01 }, 4.5)
      .to("#dot2", { className: "step-dot active", duration: 0.3 }, 4.5);

    // Step 2: upload zone
    tl.to("#finger", { x: 0, y: 0, duration: 0.01 }, 4.8)
      .to("#finger", { x: 0, y: 70, duration: 0.8, ease: "power2.inOut" }, 4.8)
      .to("#finger", { scale: 1.3, duration: 0.12 }, 5.7)
      .to("#finger", { scale: 1, duration: 0.12 }, 5.82)
      .to("#upload-zone", { borderColor: "rgba(212,175,55,0.6)", backgroundColor: "rgba(212,175,55,0.05)", duration: 0.3 }, 5.85)
      .to("#dot2", { className: "step-dot done", duration: 0.01 }, 6.2)
      .to("#dot3", { className: "step-dot active", duration: 0.3 }, 6.2);

    // Step 3: submit
    tl.to("#finger", { x: 0, y: 0, duration: 0.01 }, 6.5)
      .to("#finger", { x: 0, y: 100, duration: 0.8, ease: "power2.inOut" }, 6.5)
      .to("#finger", { scale: 1.3, duration: 0.12 }, 7.4)
      .to("#finger", { scale: 1, duration: 0.12 }, 7.52)
      // Flash
      .to("#flash", { opacity: 1, duration: 0.1 }, 7.7)
      .to("#flash", { opacity: 0, duration: 0.6 }, 7.85);

    window.__timelines["scene-3-deposit"] = tl;
  </script>
</div>
</body>
</html>
