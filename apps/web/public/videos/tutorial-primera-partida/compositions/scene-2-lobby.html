<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <title>Escena 2: Lobby — Saldo Insuficiente</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; background: #073926; }
  </style>
</head>
<body>
<div data-composition-id="scene-2-lobby" data-width="1080" data-height="1920">

  <style>
    [data-composition-id="scene-2-lobby"] {
      width: 100%; height: 100%;
      background: linear-gradient(180deg, #073926 0%, #0a2015 100%);
      position: relative; overflow: hidden;
    }
    .bg-texture {
      position: absolute; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='60' height='60' fill='none'/%3E%3Ccircle cx='30' cy='30' r='1' fill='%23ffffff' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
    }
    .scene { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding: 60px 40px 40px; }
    .card-phone {
      width: 320px; height: 580px;
      background: linear-gradient(180deg, #0d211a 0%, #0a180e 100%);
      border-radius: 28px; border: 2px solid rgba(212,175,55,0.3);
      overflow: hidden; display: flex; flex-direction: column;
      box-shadow: 0 30px 80px rgba(0,0,0,0.8);
      position: relative;
    }
    .phone-notch {
      width: 80px; height: 20px; background: #0a180e;
      border-radius: 0 0 12px 12px;
      position: absolute; top: 0; left: 50%; transform: translateX(-50%); z-index: 10;
    }
    .phone-header {
      padding: 28px 16px 12px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid rgba(212,175,55,0.15);
    }
    .header-balance { display: flex; flex-direction: column; align-items: flex-start; }
    .balance-label { font-size: 9px; color: rgba(253,240,166,0.5); text-transform: uppercase; letter-spacing: 0.2em; font-weight: 700; }
    .balance-value { font-size: 18px; font-weight: 900; color: #f87171; font-family: Georgia, serif; }
    .header-title {
      font-size: 12px; font-weight: 900; color: #d4af37;
      text-transform: uppercase; letter-spacing: 0.2em;
    }
    .phone-content { flex: 1; padding: 12px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
    .section-label {
      font-size: 9px; font-weight: 900; color: rgba(212,175,55,0.6);
      text-transform: uppercase; letter-spacing: 0.3em; margin-bottom: 2px;
    }
    .table-card {
      background: rgba(0,0,0,0.3); border: 1px solid rgba(212,175,55,0.15);
      border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px;
    }
    .table-header { display: flex; align-items: center; justify-content: space-between; }
    .table-name {
      font-size: 20px; font-family: Georgia, serif; font-weight: 900;
      color: #f3edd7; font-style: italic;
    }
    .table-meta { display: flex; align-items: center; gap: 6px; }
    .players-badge {
      display: flex; align-items: center; gap: 4px;
      background: rgba(74,222,128,0.1); border: 1px solid rgba(74,222,128,0.3);
      border-radius: 6px; padding: 3px 8px;
    }
    .players-badge svg { width: 12px; height: 12px; color: #4ade80; }
    .players-badge span { font-size: 10px; font-weight: 700; color: #4ade80; }
    .table-info { display: flex; gap: 10px; }
    .info-chip {
      display: flex; align-items: center; gap: 4px;
      background: rgba(255,255,255,0.05); border-radius: 6px; padding: 4px 8px;
    }
    .info-chip span { font-size: 10px; color: #c0a060; font-weight: 600; }
    .table-enter-btn {
      width: 100%; height: 36px;
      background: linear-gradient(180deg, #fdf0a6 0%, #d4af37 50%, #8a6d1c 100%);
      border-radius: 10px; display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 900; color: #2a1b04;
      text-transform: uppercase; letter-spacing: 0.15em;
      border-bottom: 3px solid #5c4613;
      cursor: pointer;
    }
    .table-enter-btn.insufficient { opacity: 0.5; cursor: not-allowed; }
    .alert-overlay {
      position: absolute; inset: 40px;
      background: rgba(10,24,14,0.97); border: 2px solid #f87171;
      border-radius: 20px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      z-index: 50;
      backdrop-filter: blur(10px);
    }
    .alert-icon {
      width: 50px; height: 50px; border-radius: 50%;
      background: rgba(248,113,113,0.15); border: 2px solid rgba(248,113,113,0.4);
      display: flex; align-items: center; justify-content: center;
    }
    .alert-icon svg { width: 24px; height: 24px; color: #f87171; }
    .alert-title { font-size: 16px; font-weight: 900; color: #f87171; text-transform: uppercase; letter-spacing: 0.1em; }
    .alert-msg { font-size: 12px; color: rgba(243,237,215,0.6); text-align: center; max-width: 200px; line-height: 1.5; }
    .alert-btn {
      padding: 10px 24px; background: linear-gradient(180deg, #fdf0a6 0%, #d4af37 100%);
      border-radius: 10px; font-size: 11px; font-weight: 900; color: #2a1b04;
      text-transform: uppercase; letter-spacing: 0.1em;
      border-bottom: 3px solid #5c4613;
    }
    .finger {
      position: absolute; width: 24px; height: 24px; border-radius: 50%;
      background: rgba(255,255,255,0.8); pointer-events: none;
      box-shadow: 0 0 0 3px rgba(255,255,255,0.3), 0 4px 12px rgba(0,0,0,0.5);
      z-index: 100; transform: translate(-50%, -50%);
    }
    .caption {
      position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%);
      background: rgba(10,24,14,0.95); border: 1px solid rgba(212,175,55,0.3);
      border-radius: 12px; padding: 12px 24px; max-width: 600px; text-align: center;
    }
    .caption-text { font-size: 16px; font-weight: 700; color: #fdf0a6; }
    .caption-sub { font-size: 12px; color: rgba(243,237,215,0.6); margin-top: 4px; }
  </style>

  <div class="bg-texture"></div>
  <div class="scene">
    <div class="card-phone" id="card-phone">
      <div class="phone-notch"></div>
      <div class="phone-header">
        <div class="header-balance">
          <span class="balance-label">Saldo</span>
          <span class="balance-value">$50.000</span>
        </div>
        <div class="header-title">Lobby</div>
        <div style="width: 36px;"></div>
      </div>
      <div class="phone-content">
        <div class="section-label">Mesas Disponibles</div>
        <div class="table-card">
          <div class="table-header">
            <span class="table-name"># 1</span>
            <div class="table-meta">
              <div class="players-badge">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
                <span>3 / 7</span>
              </div>
            </div>
          </div>
          <div class="table-info">
            <div class="info-chip"><span>Pique min:</span><span style="color:#d4af37;font-weight:700;">$50K</span></div>
            <div class="info-chip"><span>Banda:</span><span style="color:#d4af37;font-weight:700;">$1K</span></div>
          </div>
          <div class="table-enter-btn insufficient" id="enter-btn">Entrar a la Mesa</div>
        </div>
      </div>

      <!-- Alert overlay -->
      <div class="alert-overlay" id="alert-overlay" style="opacity:0;pointer-events:none;">
        <div class="alert-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        </div>
        <div class="alert-title">Saldo Insuficiente</div>
        <div class="alert-msg">Necesitas al menos $50.000 para entrar a esta mesa. Recarga tu saldo primero.</div>
        <div class="alert-btn" id="recargar-btn">Recargar Saldo</div>
      </div>
    </div>
  </div>

  <div class="finger" id="finger"></div>

  <div class="caption" id="caption">
    <div class="caption-text">Toca "Entrar a la Mesa" y aparece la alerta</div>
    <div class="caption-sub">Entonces tocas "Recargar Saldo" para continuar</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    tl.from(".card-phone", { scale: 0.92, opacity: 0, duration: 0.6, ease: "back.out(1.2)" }, 0.2)
      .from(".table-card", { y: 20, opacity: 0, duration: 0.5, ease: "power2.out" }, 0.5)
      .from(".alert-overlay", { scale: 0.9, opacity: 0, duration: 0.4, ease: "back.out(1.4)" }, 0.1)
      .from(".caption", { y: 30, opacity: 0, duration: 0.5, ease: "power3.out" }, 0.8)
      .from(".finger", { scale: 0, opacity: 0, duration: 0.3, ease: "back.out(2)" }, 1.2);

    // Finger moves to enter button
    tl.to("#finger", { x: 0, y: 0, duration: 0.01 }, 1.4)
      .to("#finger", { x: 0, y: 100, duration: 1.0, ease: "power2.inOut" }, 1.4)
      // Tap
      .to("#finger", { scale: 1.3, duration: 0.12 }, 2.5)
      .to("#finger", { scale: 1, duration: 0.12 }, 2.62)
      // Alert appears
      .to("#alert-overlay", { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.2)" }, 2.8)
      // Caption update
      .to("#caption .caption-text", { opacity: 0, duration: 0.2 }, 2.8)
      .to("#caption .caption-sub", { opacity: 0, duration: 0.2 }, 2.8)
      .to("#finger", { x: 0, y: 0, duration: 0.01 }, 3.5)
      .to("#finger", { x: 0, y: 80, duration: 0.8, ease: "power2.inOut" }, 3.5)
      // Tap recargar
      .to("#finger", { scale: 1.3, duration: 0.12 }, 4.4)
      .to("#finger", { scale: 1, duration: 0.12 }, 4.52)
      .to("#recargar-btn", { scale: 0.95, duration: 0.15, ease: "power2.out" }, 4.52);

    window.__timelines["scene-2-lobby"] = tl;
  </script>
</div>
</body>
</html>
